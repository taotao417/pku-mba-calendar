<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>选课表转日历 · PKU MBA 2026 秋</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#1f2329; --sub:#646a73; --line:#e5e6eb;
    --brand:#c8161d; --brand2:#e8543f; --ok:#1a9d54; --chip:#eef0f3; --chipA:#c8161d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5;}
  .wrap{max-width:720px; margin:0 auto; padding:14px 14px 90px;}
  header{background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff; border-radius:14px;
    padding:18px 16px; box-shadow:0 4px 14px rgba(200,22,29,.25);}
  header h1{margin:0 0 4px; font-size:19px; font-weight:700;}
  header p{margin:0; opacity:.92; font-size:13px;}
  .sec{margin-top:16px;}
  .sec-title{font-size:14px; font-weight:700; color:var(--sub); margin:0 0 8px; display:flex; align-items:center; gap:6px;}
  .sec-title .tag{background:var(--chip); color:var(--sub); border-radius:8px; padding:1px 8px; font-size:12px; font-weight:600;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{padding:8px 14px; background:var(--chip); border:1px solid transparent; border-radius:20px;
    font-size:14px; font-weight:600; color:var(--ink); cursor:pointer; user-select:none; transition:.15s;}
  .chip.on{background:var(--chipA); color:#fff; border-color:var(--chipA);}
  .course{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .course .top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .course .nm{font-weight:700; font-size:15.5px;}
  .course .meta{color:var(--sub); font-size:12.5px; margin-top:3px;}
  .course .cnt{background:#fff4f3; color:var(--brand); border-radius:8px; padding:2px 8px; font-size:12px; font-weight:700; white-space:nowrap;}
  .course .dates{margin-top:8px; color:var(--sub); font-size:12.5px; line-height:1.7;}
  .course .dates b{color:var(--ink); font-weight:600;}
  .ck{appearance:none; width:22px; height:22px; border:2px solid var(--line); border-radius:6px; flex:0 0 auto;
    cursor:pointer; position:relative; background:#fff;}
  .ck:checked{background:var(--brand); border-color:var(--brand);}
  .ck:checked::after{content:""; position:absolute; left:6px; top:2px; width:6px; height:11px;
    border:solid #fff; border-width:0 2.5px 2.5px 0; transform:rotate(42deg);}
  .tip{background:#fff8e6; border:1px solid #ffe1a8; color:#8a6100; border-radius:10px; padding:10px 12px;
    font-size:12.5px; margin-top:14px; line-height:1.6;}
  .bar{position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line);
    padding:10px 14px; display:flex; gap:10px; align-items:center; max-width:720px; margin:0 auto;
    box-shadow:0 -2px 10px rgba(0,0,0,.06);}
  .bar .info{font-size:13px; color:var(--sub); flex:1;}
  .bar .info b{color:var(--ink); font-size:16px;}
  .btn{background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff; border:none;
    border-radius:10px; padding:11px 18px; font-size:15px; font-weight:700; cursor:pointer; white-space:nowrap;}
  .btn:active{opacity:.85;}
  .btn.ghost{background:#fff; color:var(--brand); border:1px solid var(--brand);}
  .empty{color:var(--sub); text-align:center; padding:30px 0; font-size:14px;}
  .mini{font-size:12px; color:var(--sub);}
  .search{width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:10px;
    font-size:15px; outline:none; background:#fff; box-sizing:border-box;}
  .search:focus{border-color:var(--brand);}
  .scount{font-size:12px; color:var(--sub); margin:6px 2px 0;}
  a.dl{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>选课表转日历</h1>
    <p>PKU MBA 2026 秋季学期 · 按班级生成可导入手机的 .ics 日历</p>
  </header>

  <div class="sec">
    <div class="sec-title">① 选择你的班级 <span class="tag" id="clsHint">未选</span></div>
    <div class="chips" id="classChips"></div>
  </div>

  <div id="body" style="display:none">
    <div class="sec">
      <div class="sec-title">🔍 搜索课程 / 老师</div>
      <input id="search" class="search" placeholder="输入课程名或老师，如：国家治理 / 周长辉">
      <div class="scount" id="scount"></div>
    </div>
    <div class="sec">
      <div class="sec-title">② 必修课程 <span class="tag">自动包含</span></div>
      <div id="reqList"></div>
    </div>
    <div class="sec">
      <div class="sec-title">③ 选修课程 <span class="tag">可勾选</span>
        <span style="margin-left:auto;display:flex;gap:8px;">
          <a class="mini" id="selAll" style="cursor:pointer;color:var(--brand)">全选</a>
          <a class="mini" id="selNone" style="cursor:pointer;color:var(--brand)">全不选</a>
        </span>
      </div>
      <div id="elecList"></div>
    </div>

    <div class="tip">
      ⚠️ 已按校历剔除 4 个不排课日：<b>9-20</b>（在职班工作日）、<b>9-27</b>（中秋）、<b>10-04</b>（国庆）、<b>10-11</b>（思政课统一安排）。9-26、10-10 为正常周六上课日，已保留。
    </div>
  </div>

  <div id="empty" class="empty">请先在上方选择你的班级 👆</div>
</div>

<div class="bar" id="bar" style="display:none">
  <div class="info">必修 <b id="cntReq">0</b> 门(自动含) · 选修 <b id="cntElec">0</b> 门 · 共 <b id="cntSessions">0</b> 节</div>
  <button class="btn" id="genBtn">生成 .ics</button>
</div>

<a class="dl" id="dl"></a>

// 班级匹配：X 选中时，课程 relevant 若其 classes 含 X 或 X 的父/子级
function matchClass(courseClasses, sel){
  const toks = courseClasses.split("/").map(s=>s.trim()).filter(Boolean);
  return toks.some(t => t===sel || sel.startsWith(t) || t.startsWith(sel));
}
const ALL_CLASSES = (()=>{ const s=new Set(); COURSES.forEach(c=>c.classes.split("/").forEach(x=>s.add(x.trim()))); return [...s].filter(c=>c.startsWith("25")); })(); // 班级栏仅显示 25 开头

let currentClass = "25P6"; // 默认选中 25P6 班级
const elecSel = {}; // code -> bool
let searchTerm = "";

const $ = id => document.getElementById(id);

function renderClasses(){
  const box = $("classChips"); box.innerHTML="";
  ALL_CLASSES.forEach(cls=>{
    const el = document.createElement("div");
    el.className = "chip" + (cls===currentClass?" on":"");
    el.textContent = cls;
    el.onclick = ()=>{ currentClass = cls; renderClasses(); renderBody(); };
    box.appendChild(el);
  });
  $("clsHint").textContent = currentClass || "未选";
}

function courseCard(c, withCheck){
  const div = document.createElement("div");
  div.className = "course";
  const today = c.sessions.map(s=>s.date).sort();
  const dateStr = today.map((d,i)=> (i%3===0?"<br>":"") + "<b>"+d.slice(5)+"</b> "+s_time(c,d)).join("  ");
  const head = '<div class="top"><div style="flex:1"><div class="nm">'+esc(c.name)+'</div>'+
    '<div class="meta">'+esc(c.code)+' · '+esc(c.instructor||"")+(c.room?" · "+esc(c.room):"")+' · 班级 '+esc(c.classes)+'</div></div>'+
    '<div class="cnt">'+c.sessions.length+' 节</div></div>';
  const dates = '<div class="dates">📅 '+dateStr+'</div>';
  if(withCheck){
    const ck = document.createElement("input");
    ck.type="checkbox"; ck.className="ck"; ck.checked = !!elecSel[c.code];
    ck.onchange = ()=>{ elecSel[c.code]=ck.checked; updateBar(); };
    div.innerHTML = head; div.appendChild(ck);
  } else {
    div.innerHTML = head;
  }
  div.insertAdjacentHTML("beforeend", dates);
  return div;
}
function s_time(c,d){ const s=c.sessions.find(x=>x.date===d); return s?(s.start+"-"+s.end):""; }
function esc(s){ return (s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }

function renderBody(){
  if(!currentClass){ $("body").style.display="none"; $("bar").style.display="none"; $("empty").style.display="block"; return; }
  $("empty").style.display="none"; $("body").style.display="block"; $("bar").style.display="flex";
  const matchSearch = c => !searchTerm
    || c.name.toLowerCase().includes(searchTerm)
    || (c.instructor||"").toLowerCase().includes(searchTerm);
  const req = COURSES.filter(c=>c.type==="必修" && matchClass(c.classes,currentClass) && matchSearch(c));
  const elec = COURSES.filter(c=>c.type==="选修" && matchClass(c.classes,currentClass) && matchSearch(c));
  req.forEach(c=>{ if(!(c.code in elecSel)) elecSel[c.code]=true; });
  elec.forEach(c=>{ if(!(c.code in elecSel)) elecSel[c.code]=false; }); // 选修默认不勾选
  const rl=$("reqList"); rl.innerHTML=""; req.forEach(c=>rl.appendChild(courseCard(c,false)));
  const el=$("elecList"); el.innerHTML="";
  if(elec.length===0){ el.innerHTML='<div class="mini">该班级无匹配选修课。</div>'; }
  else elec.forEach(c=>el.appendChild(courseCard(c,true)));
  $("scount").textContent = searchTerm ? ("匹配到 必修 "+req.length+" 门 · 选修 "+elec.length+" 门") : "";
  updateBar();
}

function selectedCourses(){
  return COURSES.filter(c=> matchClass(c.classes,currentClass) && (c.type==="必修" || elecSel[c.code]));
}
function updateBar(){
  const sel = selectedCourses();
  const reqN = sel.filter(c=>c.type==="必修").length;
  const elecN = sel.filter(c=>c.type==="选修").length;
  const n = sel.reduce((a,c)=>a+c.sessions.length,0);
  $("cntReq").textContent = reqN;
  $("cntElec").textContent = elecN;
  $("cntSessions").textContent = n;
}

$("selAll").onclick = ()=>{ const elec=COURSES.filter(c=>c.type==="选修"&&matchClass(c.classes,currentClass)); elec.forEach(c=>elecSel[c.code]=true); renderBody(); };
$("selNone").onclick = ()=>{ const elec=COURSES.filter(c=>c.type==="选修"&&matchClass(c.classes,currentClass)); elec.forEach(c=>elecSel[c.code]=false); renderBody(); };
$("search").addEventListener("input", e=>{ searchTerm = e.target.value.trim().toLowerCase(); renderBody(); });

// ===== ICS 生成（UTF-8 安全折行，CRLF）=====
function foldLine(line){
  const enc = new TextEncoder();
  if(enc.encode(line).length <= 75) return line;
  const chars = Array.from(line); const res=[]; let cur=""; let curLen=0;
  for(const ch of chars){
    const cl = enc.encode(ch).length;
    if(curLen + cl > 75){ res.push(cur); cur = " " + ch; curLen = 1 + cl; }
    else { cur += ch; curLen += cl; }
  }
  if(cur) res.push(cur);
  return res.join("\r\n");
}
function pad(n){ return String(n).padStart(2,"0"); }
function fmt(dt, s){
  // s: "9:00" 或 "13:30" -> HHMMSS(6位), 兼容 H:MM / HH:MM
  const parts = s.split(":");
  const hh = String(parts[0]).padStart(2,"0");
  const mm = String(parts[1]||"0").padStart(2,"0");
  return dt.replace(/-/g,"") + "T" + hh + mm + "00";
}
function buildICS(){
  const sel = selectedCourses();
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  let out = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//PKU MBA//Timetable//CN","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  for(const c of sel){
    for(const s of c.sessions){
      const uid = (c.code+"-"+s.date+"-"+s.start+"@pku-mba").replace(/[^\w@.-]/g,"_");
      const desc = "教师：" + (c.instructor||"") + " | 课程代码：" + c.code + " | 班级：" + c.classes + " | 类型：" + c.type;
      const lines = [
        "BEGIN:VEVENT",
        "UID:"+uid,
        "DTSTAMP:"+stamp,
        "DTSTART:"+fmt(s.date,s.start),
        "DTEND:"+fmt(s.date,s.end),
        "SUMMARY:"+c.name,
        "LOCATION:"+(s.room||c.room||""),
        "DESCRIPTION:"+desc
      ];
      out.push(...lines.map(foldLine));
      out.push("END:VEVENT");
    }
  }
  out.push("END:VCALENDAR");
  return out.join("\r\n") + "\r\n";
}
$("genBtn").onclick = ()=>{
  const ics = buildICS();
  const blob = new Blob([ics], {type:"text/calendar;charset=utf-8"});
  const url = URL.createObjectURL(blob);
